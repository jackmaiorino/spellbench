name: XMage reviewed build

on:
  pull_request:
    paths:
      - 'engines/xmage/**'
      - 'python/tools/xmage_verified_entry.py'
      - 'python/tools/xmage_*sources.py'
      - 'python/tools/xmage_model_*.py'
      - 'python/tests/test_xmage_x5_guards.py'
      - '.github/workflows/xmage-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
      - name: Check actual X5 launch and resume guards
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv sync --locked --extra test
          uv run --no-sync pytest python/tests/test_xmage_x5_guards.py python/tests/test_llm_xmage_entry.py -q
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '23.0.1'
      - name: Install Maven 3.9.8 with its published checksum
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          base=https://archive.apache.org/dist/maven/maven-3/3.9.8/binaries
          archive=apache-maven-3.9.8-bin.tar.gz
          curl --fail --location --retry 2 "$base/$archive" -o "$archive"
          curl --fail --location --retry 2 "$base/$archive.sha512" -o "$archive.sha512"
          printf '%s  %s\n' "$(cat "$archive.sha512")" "$archive" | sha512sum --check
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/apache-maven-3.9.8/bin" >> "$GITHUB_PATH"
      - name: Build the pinned engine and record its source and jar hashes
        shell: bash
        run: |
          bash engines/xmage/scripts/build.sh --out "$RUNNER_TEMP/xmage-build" \
            --xmage-repo "$RUNNER_TEMP/xmage-src" --m2 "$HOME/.m2/repository"
      - name: Check RNG vectors and observation normalization
        shell: bash
        run: |
          java -cp "$RUNNER_TEMP/xmage-build/lib/*" mage.player.spellbench.x1.DeterminismCheck --selftest
          java -cp "$RUNNER_TEMP/xmage-build/lib/*" mage.player.spellbench.x3.ObservationSoak --selftest
          mkdir -p "$RUNNER_TEMP/priority-mana-check"
          javac --release 8 -cp "$RUNNER_TEMP/xmage-build/lib/*" \
            -d "$RUNNER_TEMP/priority-mana-check" engines/xmage/tests/priority-mana/EngineProfileCheck.java
          java -cp "$RUNNER_TEMP/priority-mana-check:$RUNNER_TEMP/xmage-build/lib/*" \
            mage.player.spellbench.server.EngineProfileCheck
      - name: Compile both original model searches, mixed bridge and MageZero encoder
        env:
          SPELLBENCH_CI_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python python/tools/xmage_model_ci_inputs.py --root "$RUNNER_TEMP/model-inputs"
          python python/tools/xmage_model_build.py --compile-only \
            --inputs "$RUNNER_TEMP/model-inputs" \
            --engine "$RUNNER_TEMP/xmage-build" --out "$RUNNER_TEMP/model-slices-build"
          python python/tools/xmage_model_build.py --compile-only --current-overlay \
            --inputs "$RUNNER_TEMP/model-inputs" --search-inputs "$RUNNER_TEMP/model-inputs" \
            --magezero-inputs "$RUNNER_TEMP/model-inputs" \
            --magezero-search-inputs "$RUNNER_TEMP/model-inputs" \
            --engine "$RUNNER_TEMP/xmage-build" --out "$RUNNER_TEMP/model-build"
          java -cp "$RUNNER_TEMP/model-build/model" spellbench.models.magezero.v02.search.TransportCheck
          java -cp "$RUNNER_TEMP/model-build/model:$RUNNER_TEMP/model-build/core:$RUNNER_TEMP/model-build/kit:$RUNNER_TEMP/xmage-build/lib/*" spellbench.kit.xmage.MageZeroSearchSettingsCheck
          java -cp "$RUNNER_TEMP/model-build/model:$RUNNER_TEMP/model-build/core" spellbench.models.exp1.PlaySettingsCheck
          java -cp "$RUNNER_TEMP/model-build/model:$RUNNER_TEMP/model-build/core:$RUNNER_TEMP/model-build/kit:$RUNNER_TEMP/xmage-build/lib/*" spellbench.kit.xmage.JackManaReplayCheck
          java -cp "$RUNNER_TEMP/model-build/model:$RUNNER_TEMP/model-build/core:$RUNNER_TEMP/model-build/kit:$RUNNER_TEMP/xmage-build/lib/*" spellbench.kit.xmage.JackGeneralTargetNormalizationCheck
          mana_cp="$RUNNER_TEMP/model-build/model:$RUNNER_TEMP/model-build/core:$RUNNER_TEMP/model-build/kit:$RUNNER_TEMP/xmage-build/lib/*"
          java -cp "$RUNNER_TEMP/priority-mana-check:$mana_cp" mage.player.spellbench.server.EngineProfileCheck
          javac --release 8 -cp "$mana_cp" -d "$RUNNER_TEMP/priority-mana-check" \
            engines/xmage/tests/priority-mana/ManaMappingCheck.java \
            engines/xmage/tests/priority-mana/JackManaProfileCheck.java
          java -cp "$RUNNER_TEMP/priority-mana-check:$mana_cp" spellbench.kit.xmage.ManaMappingCheck
          java -cp "$RUNNER_TEMP/priority-mana-check:$mana_cp" spellbench.kit.xmage.JackManaProfileCheck
          javac --release 8 -cp "$mana_cp" -d "$RUNNER_TEMP/priority-mana-check" \
            engines/xmage/tests/priority-binding/JackPriorityBindingCheck.java
          java -cp "$RUNNER_TEMP/priority-mana-check:$mana_cp" spellbench.kit.xmage.JackPriorityBindingCheck
          javac --release 8 -cp "$mana_cp" -d "$RUNNER_TEMP/priority-mana-check" \
            engines/xmage/tests/stack-text/StackAbilityTextCheck.java \
            engines/xmage/tests/stack-text/VisibleReplayDrawsCheck.java
          java -cp "$RUNNER_TEMP/priority-mana-check:$mana_cp" spellbench.kit.xmage.StackAbilityTextCheck
          java -cp "$RUNNER_TEMP/priority-mana-check:$mana_cp" spellbench.kit.xmage.VisibleReplayDrawsCheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xmage-reviewed-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/xmage-build/BUILD-MANIFEST.json
            ${{ runner.temp }}/xmage-build/lib/
            ${{ runner.temp }}/model-inputs/CI-INPUTS.json
            ${{ runner.temp }}/model-build/BUILD.json
          retention-days: 30
          if-no-files-found: error
