name: gorge bounded public replay
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      asset_id:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
permissions:
  contents: write
jobs:
  replay:
    if: github.repository == 'jackmaiorino/spellbench' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Recover unused hosted SDK space
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force
      - name: Build pinned production and check three exact actor-public prefixes
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RELEASE_ID: ${{ inputs.release_id }}
          REPLAY_ASSET_ID: ${{ inputs.asset_id }}
          REPLAY_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: python3 tools/gorge-public-replay-ci.py --job "$RUNNER_TEMP/gorge-public-replay" --release-id "$REPLAY_RELEASE_ID" --asset-id "$REPLAY_ASSET_ID" --archive-sha256 "$REPLAY_ARCHIVE_SHA256"
