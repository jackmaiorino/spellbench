name: LLM container isolation

on:
  pull_request:
    paths:
      - 'python/spellbench/llm/**'
      - 'python/tests/test_llm*'
      - 'python/tools/llm_container_image.py'
      - 'integrations/llm-sandbox/**'
      - '.github/workflows/llm-container.yml'

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check uv==0.11.29
      - run: uv sync --locked --extra test
      - name: Build public-source image
        run: |
          uv run --no-sync python python/tools/llm_container_image.py --out out/container-image.json
          python -c 'import json,os; image=json.load(open("out/container-image.json"))["image_id"]; open(os.environ["GITHUB_ENV"],"a").write("SPELLBENCH_LLM_DOCKER_IMAGE="+image+"\n")'
          cat out/container-image.json
      - name: Preserve the immutable image before its checks
        run: docker save "$SPELLBENCH_LLM_DOCKER_IMAGE" | gzip > out/llm-image.tar.gz
      - name: Verify actual confinement and teardown
        env:
          SPELLBENCH_RUN_DOCKER_TESTS: '1'
        run: uv run --no-sync pytest python/tests/test_llm_docker.py -q --junitxml=out/container-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: llm-container-receipt
          path: |
            out/container-image.json
            out/container-tests.xml
            out/llm-image.tar.gz
          retention-days: 30
