name: LLM adapter checks

on:
  pull_request:
    paths:
      - 'python/spellbench/llm/**'
      - 'python/tests/test_llm*'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/llm.yml'

permissions:
  contents: read

jobs:
  llm-tests:
    name: LLM transport (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check uv==0.11.29
      - run: uv sync --locked --extra test --extra chatgpt
      - run: uv run --no-sync pytest python/tests/test_llm_agent.py python/tests/test_llm_http.py python/tests/test_llm_broker.py python/tests/test_llm_chatgpt.py python/tests/test_llm_login.py python/tests/test_llm_tls.py python/tests/test_bot_server.py python/tests/test_host_agent_process.py python/tests/test_host_game.py -q
